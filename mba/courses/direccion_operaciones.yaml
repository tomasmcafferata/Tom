  mejora_procesos:
    archivo: "modulo4_mejora_procesos.pdf"
    temas: "estrategia de procesos: estructura (mostrador / oficina híbrida / trastienda), participación del cliente, flexibilidad de recursos, intensidad de capital; revisión y mejora de procesos"
  customer_experience:
    archivo: null   # anunciado en el deck de Romano, sin material en la carpeta

# Materia CONCEPTUAL dirigida por decks (mismo patrón que Sistemas y Diseño Organizacional),
# con una parte PRÁCTICA en Gestión de Proyectos (camino crítico, EDT, riesgos).
content_management:
  type: conceptual_deck_driven
  notebooklm: false
  notebooklm_rationale: >
    Los decks son cortos (1.400-4.300 palabras) y Claude los lee directo. La bibliografía
    complementaria de Agile (Agile Samurai ~59k palabras en inglés, Guía Práctica Ágil del PMI ~48k)
    es de consulta, no núcleo. No justifica el setup de NotebookLM.
  notas_criticas: >
    Los decks son muy visuales: pdftotext pierde diagramas y ejemplos con imágenes. Las notas de clase
    son la fuente que completa el contenido — pedirlas siempre con el trigger "clase".
  ejercicios: >
    La resolución del camino crítico está en el deck (slide 41, solo ida). Verificada con ida, vuelta y
    holguras: crítico A-B-D-M-FIN, duración 50. Tabla completa en la página del Módulo 3.

erratas:
  guia_riesgos_escala_costo: >
    Tabla p.5: muy bajo <5%, bajo 5-10%, medio 10-15%, alto >15%. Anexo I: muy bajo <3%, bajo 3-5%,
    medio 5-10%, alto >10%. La guía aclara que los % se adaptan al presupuesto.
  scrum_deck_vs_guia_2020: >
    El deck usa "Scrum Team" para los Developers y tiempos por sprint de 1 semana (Planning 2h, Review 1h,
    Retro 60-90 min). Máximos oficiales para sprint de 1 mes: 8h / 4h / 3h; Daily 15 min.
