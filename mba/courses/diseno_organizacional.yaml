# Materia CONCEPTUAL dirigida por decks — mismo patrón que Sistemas de Información:
content_management:
  type: conceptual_deck_driven
  notebooklm: false
  notebooklm_rationale: >
    Los decks de Delle Donne son autocontenidos y opinados: traen teoría, casos y las
    respuestas modelo de los talleres. Brickley (el libro obligatorio) queda como
    referencia de consulta puntual, no como fuente de estudio. Además el 80% de la nota
    son dos instancias cuyo contenido ya se conoce, así que no hay nada que anticipar.
  local_mirror: "mba/presentations/diseno_organizacional/"   # espejo .md del hub de ClickUp

# El marco que estructura TODA la materia. Todo caso se analiza buscando la
# inconsistencia entre estos tres pilares.
marco_tres_pilares:
  asignacion_de_autoridad: "¿Qué se va a hacer y quién decide?      → Clase 3"
  medicion_del_desempeno: "¿Cómo confirmamos que se hizo lo pactado? → Clase 5"
  politica_compensatoria: "¿Qué se recibe por hacer lo pactado?      → Clase 4"
  principio_rector: >
    El diseño de una empresa debe maximizar la probabilidad de que los tomadores de
    decisión tengan (1) la información relevante y (2) los incentivos para usarla
    productivamente. Una debilidad en cualquiera de los tres pilares hace fracasar
    la estrategia.

bibliography_priority:
  - "Brickley, Smith & Zimmerman — Managerial Economics and Organizational Architecture [OBLIGATORIA]"
  - "Jensen & Meckling (1994, 1995) — The Nature of Man / Specific and General Knowledge"
  - "Kerr (1975) — On the folly of rewarding A while hoping for B"
  - "Levitt & Dubner — Freakonomics"
  - "Lorsch & McTague (2016) — Culture Is Not the Culprit (HBR)"
  - "Eichenwald (2012) — Microsoft's Lost Decade (Vanity Fair)"
  - "Kwoh (2012) — Rank and Yank (WSJ)"
  - "Beck (2017)"
  - "Pérez Navarro (2020) — ¿Por qué cuesta tanto obtener los resultados deseados de un incentivo? (Capital Humano)"

