    - "Microsoft: Ballmer → Nadella"
    - "Uber: Kalanick → Khosrowshahi"
    - "Google: el 20% y el stack ranking"
    - "Best Buy / Hubert Joly"
    - "Lockheed Martin y Skunk Works"
    - "Starbucks: Schultz → Niccol"
    - "Disney: Chapek → Iger"
    - "McKinsey y el up-or-out"
  ejemplos_resueltos: ["Volkswagen / Dieselgate", "Haier / Rendanheyi"]
  estructura_consigna: >
    Siempre tres preguntas: (1) explicar la conducta desde el modelo de comportamiento (REMM),
    (2) identificar las fallas en los tres pilares de la AO, (3) recomendar una intervención por pilar.

# Materia CONCEPTUAL dirigida por decks — mismo patrón que Sistemas de Información:
content_management:
  type: conceptual_deck_driven
  notebooklm: false
  notebooklm_rationale: >
    Brickley (Managerial Economics and Organizational Architecture) es la bibliografía obligatoria
    y son ~600 páginas, pero las dos evaluaciones no lo requieren: las 68 preguntas del examen ya
    se conocen y 57 se contestan con los decks, las 11 restantes con seis artículos cortos que
    están todos en el repo. El trabajo final aplica el marco de tres pilares, que los decks
    desarrollan completo y con respuestas modelo. El costo de setup de NotebookLM no se paga.
  unified_page: "una página por clase, precargada desde el deck y refinada con las notas"
  metodo: >
    El estudio se organiza alrededor de las dos evaluaciones, no del temario: se responde el banco
    de 68 preguntas y se practican los 12 casos con el trigger "caso" en modo completo.

bibliography_priority:
  - "Brickley, Smith & Zimmerman — Managerial Economics and Organizational Architecture [OBLIGATORIA — referencia de consulta]"
  - "Lorsch, J. & McTague, E. (2016) — Culture Is Not the Culprit (HBR) [examen: P22-24]"
  - "Eichenwald, K. (2012) — Microsoft's Lost Decade (Vanity Fair) [examen: P54-56]"
  - "Brickley, Smith & Zimmerman (2020) — The Economics of Organizational Architecture (JACF) [examen: P38-39]"
  - "Zhu & Xie (2023) — The Role and Optimization Strategies of Compensation Incentives [examen: P40-41]"
  - "Pérez Navarro, J. (2020) — ¿Por qué cuesta tanto obtener los resultados deseados de un incentivo? [examen: P25-26]"
  - "Hess, A.J. (2023) — Ranking workers can hurt morale and productivity (Fast Company) [examen: P57]"
  - "Jensen, M. & Meckling, W. (1994) — The Nature of Man / La Naturaleza del Hombre [fuente del REMM]"
  - "Jensen, M. & Meckling, W. (1995) — Specific and General Knowledge, and Organizational Structure"
  - "Kerr, S. (1975) — On the Folly of Rewarding A, While Hoping for B"
  - "Levitt & Dubner — Freakonomics, Intro y Cap. 1"
  - "Janis, I. (1972) — Pensamiento Grupal"

