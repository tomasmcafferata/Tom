  - "lectura_estructura_capital_teorias.pdf"    # 70 pg — MM, Trade-Off (Unidad 2)
  - "lectura_inversion_fcf.pdf"                 # 60 pg — FCF, VAN, TIR (Unidad 3)
  - "ejercicios_costo_capital.pdf"              # + ejercicios_costo_capital_resolucion.xlsx
  - "ejercicios_fcf.pdf"                        # + ejercicios_fcf_resolucion.xlsx
