syllabus_programa:
  unidad_1: "Las FC y su función. Creación y medición de valor. Gobernanza corporativa y problemas de agencia."
  unidad_2: "Decisiones de financiamiento y estructura de capital. Teorías (Modigliani-Miller, Trade-Off). Costo de capital. WACC."
  unidad_3: "Decisiones de inversión. Free Cash Flow. Payback, payback ajustado, VAN, TIR, TIR modificada. Proyectos mutuamente excluyentes."
  unidad_4: "Beneficio económico: EVA (Economic Value Added)."

