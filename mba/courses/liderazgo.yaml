syllabus_actual:
  clase_1:
    date: TBD
    hub_page_id: "8cm37vq-11073"
    topic: "Liderazgo, IA y Autoconocimiento — Personalidad (MBTI E/I y S/N)"
    key_concepts:
      - Liderazgo emergente vs liderazgo efectivo
      - Eficacia vs eficiencia
      - Efecto Halo (Landy & Sigall 1974)
      - Fenómeno Workslop (IA y trabajo de baja calidad)
      - Caso Managing AI Workslop at Escape Velocity (HBP 8898)
      - Competence Illusion (Greg Isenberg)
      - Autoconocimiento como base del liderazgo
      - Phil Jackson — gestión individualizada de talentos
      - Roadmap del curso (intrapersonal → interpersonal → conflicto → liderazgo → integrador)
      - Ejercicio El Kit para Liderar (5 arquetipos)
      - Personalidad como constructo (nivel conductual vs psicológico)
      - Frameworks de personalidad (MBTI, DISC, Big Five, Keirsey, HPI Hogan)
      - Hogan — 3 motivos universales (cooperación, competencia, significado)
      - Temperamento vs carácter
      - Identidad vs reputación
      - MBTI — origen (Briggs & Myers, 1943, basado en Jung)
      - Dimensión Energía — Extroversión (E) vs Introversión (I)
      - Dimensión Percepción — Sensación (S) vs Intuición (N)
      - Aplicaciones en contextos laborales
      - Principio de adaptabilidad y flexibilidad
