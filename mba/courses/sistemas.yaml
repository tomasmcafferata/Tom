programa_pdf_desactualizado: true

# Materia CONCEPTUAL dirigida por decks — el pipeline estándar MBA se adapta:
content_management:
  type: conceptual_deck_driven
  notebooklm: false   # los decks del profesor son autocontenidos y opinados; Claude los lee directo
  notebooklm_rationale: >
    Laudon 17ª ed. son 81MB / ~600pg en inglés, citado solo puntualmente por el profesor
    (Cap. 12 y 13). Los decks tienen frameworks propios (BCG DAI, los 4 patrones del 6%,
    Human in the Lead) y casos que son lo que el quiz va a evaluar. Con 4 clases de
    contenido y el curso cerrando el 07/09, el costo de setup de NotebookLM no se paga.
  unified_page: "una página por clase, precargada desde el deck y refinada con las notas"

bibliography_priority:
  - "Laudon, K. (2022) — Sistemas de Información Gerencial, 17ª ed., Pearson [OBLIGATORIA — referencia de consulta]"
