  - "Hammer, M. (1990) — Reengineering Work: Don't Automate, Obliterate (HBR)"
  - "McAfee, A. & Brynjolfsson, E. (2012) — Big Data: The Management Revolution (HBR)"
  - "Davenport, T. (2019) — What Process Mining Is, and Why Companies Should Do It (HBR)"

