  ife:
    name: "Información Financiera de la Empresa"
    schedule_day: Wednesday
    modality: virtual
    classes_completed: 4
    total_classes: 6
    last_class_date: "2026-06-03"
    last_class_topic: "Informes Contables — ESP y Estado de Resultados"
    topics_covered:
      # Nivelatorio
      - Ecuación patrimonial (Activo = Pasivo + Patrimonio Neto)
      - Variaciones permutativas (solo activos/pasivos, PN no cambia)
      - Variaciones modificativas (afectan Capital y/o Resultados)
      - Devengado vs percibido
      - Situación económica / financiera / patrimonial (independientes entre sí)
      - Caso Máster S.A. (9 hechos económicos — amortización, revaluación, intereses devengados, dividendos)
      # Clase 1
      - Información financiera vs contable
      - Usuarios de la información contable
      - Contabilidad financiera vs gestión
      - Ciclo contable
      - Normas contables (NIIF, US GAAP, RT FACPCE)
      - IFRS — RT 26 en Argentina (obligatoria CNV, optativa resto)
      - Modelo contable (unidad de medida, criterios de medición, capital a mantener)
      - Valores históricos vs valores corrientes
      - Valor razonable (fair value)
      - Valor recuperable (VNR vs VUE)
      - Capital financiero vs físico
      - Hechos contingentes (probabilidad alta / no alta / remota)
      - Hechos posteriores al cierre
      - Ajustes a resultados de ejercicios anteriores
      - PCGA (15 principios)
      - Posición del analista vs del contador
      # Clase 2
      - Combinaciones del modelo contable (histórico nominal / ajustado / valores corrientes / NIIF)
      - RECPAM — resultado por exposición a inflación en partidas monetarias
      - REI — resultado por tenencia de bienes no monetarios
      - Partidas monetarias vs no monetarias
      - Caso práctico aplicando distintos modelos contables
      # Clase 3
      - Costo histórico vs costo corriente — definiciones precisas
      - Valor recuperable = max(VNR, VUE)
      - NIIF / RT 26 — obligatoria CNV, optativa resto; ventajas y desventajas
      - Valor razonable — definición NIIF; mejor evidencia = precios de mercado activo
      - Hechos contingentes — tabla completa (probabilidad alta/medible, alta/no medible, sin prob. alta, remota)
      - Hechos posteriores — dos categorías (evidencia de situación al cierre vs hecho nuevo)
      - AREA — corrección de error o cambio de norma; cambios de estimación NO generan AREA
      - Medición de 6 rubros — inicial y al cierre:
      - Caja y bancos — valor nominal; moneda extranjera al TC de cierre
      - Créditos y deudas — VAFF a TIR/TEE; cancelación anticipada VNR/VAFF acreedor
      - Inversiones en acciones — VNR / Costo / VPP según tipo; títulos de deuda — VNR o Costo+RFD según intención
      - Bienes de cambio — fungibles VNR; proceso prolongado (árbol de decisión); resto (anticipos+contrato VNR, sino costo reposición)
      - Bienes de uso — uso/alquiler costo−depreciación; venta VNR; erogaciones posteriores gasto vs mejora; revalúo técnico RT31 (resultado diferido PN)
      - Bienes intangibles — condiciones reconocimiento; exclusiones; casos especiales activación; depreciación 20 años (5 años organización/preoperativos)
      # Clase 4
      - Los 4 estados básicos + notas: ESP, ER, EEPN, EFE
      - Estados individuales vs consolidados
      - Usuarios de los estados contables (8 tipos)
      - ESP — estructura Activo/Pasivo/PN; corriente vs no corriente; contenido de activos y pasivos; Activo=Inversión / Pasivo+PN=Financiación
      - Previsiones — compromisos contingentes dentro del pasivo
      - Estado de Resultados — estructura completa: Ventas → Resultado Bruto → EBIT → EBITDA
      - EBITDAC — variante COVID (gastos/pérdidas por COVID se agregan al EBITDA)
      - Otros Resultados Integrales (ORI) — van directo al PN sin pasar por el ER
      - EEPN — muestra cambios en el PN: aportes, distribuciones y resultado del ejercicio
      - Notas y Anexos — características (parte integrante), contenido (datos generales, bases presentación, otra información)
      - Síntesis: mapa de informes contables para terceros vs internos
