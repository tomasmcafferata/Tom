      - Investigador de Recursos (IR) — extrovertido, explora oportunidades / sombra: pierde interés rápido
      - Coordinador (CO) — maduro, confiante, delega bien / sombra: puede verse como manipulador
      - Impulsor (IS) — retador, dinámico, supera obstáculos / sombra: propenso a provocar
      - Monitor Evaluador (ME) — estratégico, perspicaz, evalúa opciones / sombra: le falta capacidad de inspirar
      - Cohesionador (CH) — cooperador, perceptivo, evita fricciones / sombra: indeciso bajo presión
      - Implementador (ID) — disciplinado, confiable, convierte ideas en acciones / sombra: inflexible
      - Finalizador (FI) — meticuloso, detecta errores, cumple plazos / sombra: se preocupa innecesariamente
      - Especialista (ES) — dedicado, provee conocimiento profundo / sombra: se centra solo en su especialidad
